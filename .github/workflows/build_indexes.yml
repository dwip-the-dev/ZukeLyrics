name: Rebuild Catalog & Indexes

on:
  push:
    branches:
      - main
    paths:
      - 'lyrics-database/**'

concurrency:
  group: rebuild-catalog-indexes
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild Indexes and Catalog
        run: |
          python3 tools/index_builder.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index/ api/
          if git diff --staged --quiet; then
            echo "No changes in catalog or indexes."
            exit 0
          fi
          git commit -m "Automated: Rebuild search index & catalog [skip ci]"
          for i in 1 2 3 4 5; do
            echo "Attempt $i: pulling rebase and pushing..."
            if git pull --rebase origin main && git push origin main; then
              echo "Successfully pushed updated indexes!"
              exit 0
            fi
            sleep $((i * 2))
          done
          echo "Failed to push after 5 attempts."
          exit 1

