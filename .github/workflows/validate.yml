name: Validate Lyrics

on:
  push:
    paths:
      - 'lyrics-database/**'
      - 'schemas/**'
  pull_request:
    paths:
      - 'lyrics-database/**'
      - 'schemas/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ZukeLyrics Format Validator
        run: |
          python3 tools/validator.py lyrics-database
